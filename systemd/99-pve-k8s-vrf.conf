# pve-k8s dedicated-VNet mode (T3.4): cluster nodes reach
# the PVE API through their tenant VRF's anycast gateway
# SVI. pveproxy's socket lives in the default VRF, and
# Linux will not deliver TCP arriving via a VRF device to
# it unless l3mdev acceptance is enabled. Authentication
# is unaffected (scoped API tokens); this only lets the
# connection reach the daemon.
net.ipv4.tcp_l3mdev_accept = 1
